<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Produse</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Manager de Produse</h1>
      <p>Gestiune catalog prin REST API</p>
    </div>
  </header>

  <main class="container main-grid">
    <!-- Formular de adaugare produs (POST) -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Adauga produs nou</h2>
      
      <form id="product-form">
        <div class="form-group">
          <label for="name">Nume produs</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            minlength="2" 
            placeholder="Ex: Monitoare audio KRK" 
            required>
        </div>

        <div class="form-group">
          <label for="price">Pret</label>
          <input 
            type="number" 
            id="price" 
            name="price" 
            min="1" 
            step="0.01" 
            placeholder="Ex: 1249.99" 
            required>
        </div>

        <div class="form-group">
          <label for="category">Categorie</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Selectează o categorie...</option>
            <option value="Electronice">Electronice</option>
            <option value="Electrocasnice">Electrocasnice</option>
            <option value="Accesorii IT">Accesorii IT</option>
            <option value="Casa și Gradina">Casa și Gradina</option>
          </select>
        </div>

        <!-- Mesajele de eroare (4xx/5xx/retea) sau confirmare (201) -->
        <p id="form-feedback" class="feedback hidden" aria-live="polite"></p>

        <button type="submit" id="submit-btn" class="btn btn-primary">
          Adauga in catalog
        </button>
      </form>
    </section>

    <!-- Lista de produse (GET + DELETE cu Event Delegation) -->
    <section class="card" aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">Catalog produse</h2>
      </div>

      <!-- Cele 3 stari vizibile: Se incarca, Eroare, Lista goala -->
      <div id="list-state" class="state-box" aria-live="polite">
        Se incarca produsele...
      </div>

      <!-- Event Delegation -->
      <ul id="products-list" class="products-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Tema Frontend & REST API</p>
    </div>
  </footer>
</body>
</html>
